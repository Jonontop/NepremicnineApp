<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepremičninski Portal - Luxury Bold</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-50 text-stone-800 font-sans">

    <div class="bg-gradient-to-br from-stone-900 to-stone-950 text-white rounded-b-[2.5rem] shadow-2xl">
        <nav class="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between border-b border-white/10">
            <span class="text-2xl font-serif tracking-wide">ESTATE<span class="text-amber-400">.si</span></span>
            <div class="hidden md:flex items-center gap-8 text-sm uppercase tracking-widest font-medium text-stone-300">
                <a href="#" class="text-amber-400">Nepremičnine</a>
                <a href="#" class="hover:text-white transition">Agencije</a>
                <a href="#" class="hover:text-white transition">O nas</a>
            </div>
            <button class="border border-white/30 hover:border-amber-400 px-5 py-2 rounded-lg text-sm uppercase tracking-wider transition">Vstop</button>
        </nav>

        <section class="max-w-7xl mx-auto px-6 py-24 text-left grid md:grid-cols-2 gap-12 items-center">
            <div>
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-serif leading-tight">
                    Odkrijte bivalne prostore z <span class="italic text-amber-400">karakterjem</span>.
                </h1>
                <p class="text-stone-400 mt-6 text-lg max-w-lg">
                    Pregledujte ekskluzivne projekte, luksuzne novogradnje in preverjene nepremičnine po celotni Sloveniji.
                </p>
            </div>
            
            <div class="bg-white text-stone-900 p-8 rounded-2xl shadow-2xl border border-white/10">
                <div class="flex gap-2 bg-stone-100 p-1 rounded-lg mb-6">
                    <button class="w-1/2 py-2 text-center text-sm font-semibold bg-white rounded-md shadow-sm">Naroči nakup</button>
                    <button class="w-1/2 py-2 text-center text-sm font-medium text-stone-500 hover:text-stone-900">Najem</button>
                </div>
                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-bold uppercase tracking-wider text-stone-400">Kje iščete?</label>
                        <input type="text" placeholder="Vtipkajte mesto, regijo ali ulico..." class="w-full mt-1 px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:border-stone-900 transition">
                    </div>
                    <div>
                        <label class="text-xs font-bold uppercase tracking-wider text-stone-400">Maksimalna proračunska meja</label>
                        <input type="text" placeholder="Npr. 300.000 €" class="w-full mt-1 px-4 py-3 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:border-stone-900 transition">
                    </div>
                    <button class="w-full bg-stone-950 hover:bg-stone-800 text-amber-400 py-4 rounded-xl font-bold uppercase tracking-wider transition shadow-lg mt-2">Prikaži rezultate</button>
                </div>
            </div>
        </section>
    </div>

</body>
</html>
