<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepremičninski Portal - Modern</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">N</div>
                <span class="text-xl font-bold tracking-tight text-slate-900">PROSTOR<span class="text-indigo-600">.si</span></span>
            </div>
            <div class="hidden md:flex items-center gap-8 font-medium text-slate-600">
                <a href="#" class="text-indigo-600">Domov</a>
                <a href="#" class="hover:text-slate-900 transition">Novogradnje</a>
                <a href="#" class="hover:text-slate-900 transition">Prodaja</a>
                <a href="#" class="hover:text-slate-900 transition">Oddaja</a>
            </div>
            <button class="bg-slate-900 text-white px-5 py-2.5 rounded-xl font-medium hover:bg-slate-800 transition shadow-sm">Moj Račun</button>
        </div>
    </nav>

    <section class="max-w-7xl mx-auto px-6 pt-16 pb-24 text-center">
        <span class="bg-indigo-50 text-indigo-700 text-sm font-semibold px-4 py-1.5 rounded-full uppercase tracking-wider">Pametno iskanje nepremičnin</span>
        <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight text-slate-900 mt-6 max-w-4xl mx-auto leading-tight">
            Najdi svoj naslednji dom brez kompliciranja.
        </h1>
        <p class="text-lg md:text-xl text-slate-500 mt-6 max-w-2xl mx-auto">
            Združeni oglasi z vseh največjih slovenskih nepremičninskih agencij na enem mestu. Posodobljeno vsako uro.
        </p>

        <div class="max-w-4xl mx-auto mt-12 bg-white p-4 rounded-2xl shadow-xl border border-slate-100/80 flex flex-col md:flex-row gap-4 items-center">
            <div class="w-full md:w-1/3 text-left px-3">
                <label class="block text-xs font-bold uppercase text-slate-400 tracking-wider">Lokacija</label>
                <select class="w-full mt-1 bg-transparent border-none text-slate-800 font-medium focus:outline-none">
                    <option>Vsa Slovenija</option>
                    <option>Ljubljana</option>
                    <option>Koroška</option>
                    <option>Podravska</option>
                </select>
            </div>
            <div class="h-px w-full md:h-8 md:w-px bg-slate-200"></div>
            <div class="w-full md:w-1/3 text-left px-3">
                <label class="block text-xs font-bold uppercase text-slate-400 tracking-wider">Tip Nepremičnine</label>
                <select class="w-full mt-1 bg-transparent border-none text-slate-800 font-medium focus:outline-none">
                    <option>Stanovanje</option>
                    <option>Hiša</option>
                    <option>Zemljišče</option>
                </select>
            </div>
            <div class="h-px w-full md:h-8 md:w-px bg-slate-200"></div>
            <div class="w-full md:w-1/3 flex items-center justify-between gap-4 px-3">
                <div class="text-left">
                    <label class="block text-xs font-bold uppercase text-slate-400 tracking-wider">Cena do</label>
                    <input type="text" placeholder="Vnesi znesek" class="w-full mt-1 bg-transparent border-none text-slate-800 font-medium focus:outline-none placeholder-slate-400">
                </div>
                <button class="bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-xl shadow-md transition shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </button>
            </div>
        </div>
    </section>

</body>
</html>
